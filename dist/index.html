  <!-- iOS Safari 防白屏与动态时间戳突破强缓存脚本 -->
  <script>
    (function() {
      function forceFreshReload() {
        try {
          var lastTs = sessionStorage.getItem('ios_last_fresh_ts');
          var now = Date.now();
          if (!lastTs || now - Number(lastTs) > 3000) {
            sessionStorage.setItem('ios_last_fresh_ts', String(now));
            var href = window.location.href;
            var cleanUrl = href.replace(/([?&])fresh=[^&]*/g, '').replace(/([?&])v=[^&]*/g, '').replace(/\?$/, '');
            var sep = cleanUrl.indexOf('?') === -1 ? '?' : '&';
            window.location.href = cleanUrl + sep + 'fresh=' + now;
          }
        } catch(e) {}
      }

      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
        }
      } catch(e) {}

      // 捕获静态资源 404/错误
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          forceFreshReload();
        }
      }, true);

      // DOM 挂载检测：1 秒后若 #app 节点为空，自动以最新时间戳重载
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var app = document.getElementById('app');
          if (app && (!app.children || app.children.length === 0)) {
            forceFreshReload();
          }
        }, 1000);
      });
    })();
  </script>
