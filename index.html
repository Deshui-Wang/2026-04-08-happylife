<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RICH" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💰RICH💰</title>

  <!-- iOS Standalone WebApp / Safari 强力防白屏与自动恢复脚本 -->
  <script>
    (function() {
      // 1. 清理可能卡死 iOS Safari 强缓存的旧 Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
      }

      // 2. 捕获 JS/CSS 静态资源加载失效（如发版后旧 Hash 文件不复存在）自动刷新防白屏
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var lastReload = sessionStorage.getItem('ios_auto_reload_ts');
          if (!lastReload || Date.now() - Number(lastReload) > 4000) {
            sessionStorage.setItem('ios_auto_reload_ts', String(Date.now()));
            window.location.reload(true);
          }
        }
      }, true);

      // 3. 针对 iOS 桌面 PWA 图标切前台时 DOM 为空的极度极端防御
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          var appEl = document.getElementById('app');
          if (appEl && (!appEl.children || appEl.children.length === 0)) {
            window.location.reload(true);
          }
        }
      });
    })();
  </script>

  <!-- 引入 Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Long+Cang&family=Pacifico&family=Quicksand:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
