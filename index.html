<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RICH" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💰RICH💰</title>

  <!-- iOS Safari 普通模式强缓存破解与无感自动恢复脚本 -->
  <script>
    (function() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
        }
      } catch(e) {}

      // 捕获脚本加载错误
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var href = window.location.href;
          if (href.indexOf('fresh=') === -1) {
            var sep = href.indexOf('?') === -1 ? '?' : '&';
            window.location.href = href + sep + 'fresh=' + Date.now();
          } else {
            window.location.reload(true);
          }
        }
      }, true);

      // DOM 挂载检测：若 1.2 秒内仍然为空（白屏），自动带上 fresh 参数强制突破 HTTP 强缓存
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var app = document.getElementById('app');
          if (app && (!app.children || app.children.length === 0)) {
            var href = window.location.href;
            if (href.indexOf('fresh=') === -1) {
              var sep = href.indexOf('?') === -1 ? '?' : '&';
              window.location.href = href + sep + 'fresh=' + Date.now();
            } else {
              window.location.reload(true);
            }
          }
        }, 1200);
      });
    })();
  </script>

  <!-- 引入 Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Long+Cang&family=Pacifico&family=Quicksand:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
